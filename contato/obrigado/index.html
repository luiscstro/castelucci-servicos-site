<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castelucci Serviços</title>
<meta name="description" content="Recebemos sua mensagem. A equipe da Castelucci Serviços retornará em breve.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/brand/favicon-32.png">
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<div id="load-progress"></div>
<header class="site-header" id="site-header">
  <div class="container nav">
    <a href="../../" class="nav-brand">
      <img src="../../assets/img/brand/logo-azul-horizontal-vetorizada.svg" alt="Castelucci Serviços">
    </a>
  </div>
</header>
<main id="main">
  <section class="section" style="min-height:60vh;display:flex;align-items:center;">
    <div class="container" style="text-align:center;max-width:560px;" data-reveal>
      <div class="card-icon" style="width:72px;height:72px;border-radius:50%;background:var(--bg-tint);margin:0 auto var(--space-4);">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1>Mensagem enviada</h1>
      <p>Obrigado pelo contato. Nossa equipe vai analisar sua mensagem e retornar o quanto antes, normalmente em até 1 dia útil.</p>
      <a href="../../" class="btn btn-primary">Voltar ao início</a>
    </div>
  </section>
</main>
<footer class="site-footer">
  <div class="container footer-bottom" style="border-top:none;margin-top:0;padding-top:var(--space-4);">
    <span>© <span id="year"></span> Castelucci Serviços em Geral LDTA. Todos os direitos reservados.</span>
    <a href="../../politica-de-privacidade/">Política de Privacidade</a>
  </div>
</footer>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
<script src="../../assets/js/main.js"></script>
</body>
</html>
